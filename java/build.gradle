plugins {
    id 'java'
    id 'io.github.zed-0xff.zb-gradle-plugin' version '1.0.1'
}

zbSigning {
    jarTask = 'jar'
}

def gameDir = findProperty('gameDir') ?: 'C:/Games/Steam/steamapps/common/ProjectZomboid'
def pzVersion = findProperty('pzVersion') ?: '42.20'

if (!(pzVersion ==~ /\d+(\.\d+)+/)) {
    throw new GradleException("pzVersion must be a numeric Project Zomboid version directory, got: ${pzVersion}")
}

dependencies {
    compileOnly files("${gameDir}/ZombieBuddy.jar")
    compileOnly files("${gameDir}/projectzomboid.jar")
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    // This template has no downloaded runtime dependencies.
}

sourceSets {
    main {
        java.srcDirs = ['src']
    }
}

jar {
    archiveBaseName.set('EngineFixesAndTweaks')
}

tasks.register('packageModJar', Copy) {
    dependsOn tasks.named('signJarZBS')
    from(layout.buildDirectory.dir('libs')) {
        include 'EngineFixesAndTweaks.jar'
        include 'EngineFixesAndTweaks.jar.zbs'
    }
    into file("../${pzVersion}/media/java")
}
